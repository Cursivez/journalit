minimumReleaseAge: 10080
engineStrict: true

# pnpm v10 blocks dependency lifecycle scripts unless explicitly trusted.
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver

peerDependencyRules:
  allowedVersions:
    obsidian: 1.12.3

# Reject package-resolution metadata that weakens previously established trust.
trustPolicy: no-downgrade
